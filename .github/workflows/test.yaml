name: Test
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.x
      - name: Check Go formatting
        run: test -z "$(gofmt -l .)"
      - name: Test DNS fallback
        run: |
          go mod download
          docker run --rm --network none \
            --dns 127.0.0.2 --dns 127.0.0.3 --dns-option timeout:5 --dns-option attempts:1 \
            -v "$PWD:/src:ro" -v "$(go env GOMODCACHE):/go/pkg/mod:ro" \
            -e GOPROXY=off -e GOSUMDB=off -e WIREHOP_TEST_DNS_FALLBACK=1 -w /src \
            golang:1.27-bookworm go test -race -v ./internal/command -run '^TestDNSFallback$' -count=1 -timeout=3m
      - name: Fuzz input boundaries
        run: |
          go test ./internal/laneurl -run '^$' -fuzz '^FuzzParseDial$' -fuzztime 1000000x
          go test ./internal/laneurl -run '^$' -fuzz '^FuzzParseListen$' -fuzztime 1000000x
          go test ./internal/lanespec -run '^$' -fuzz '^FuzzParse$' -fuzztime 1000000x
          go test ./internal/target -run '^$' -fuzz '^FuzzParse$' -fuzztime 1000000x
          go test ./internal/wgpacket -run '^$' -fuzz '^FuzzClassify$' -fuzztime 1000000x
          go test ./internal/wgpacket -run '^$' -fuzz '^FuzzReservedText$' -fuzztime 1000000x
          go test ./internal/protocol -run '^$' -fuzz '^FuzzParseFrames$' -fuzztime 1000000x
          go test ./internal/protocol -run '^$' -fuzz '^FuzzParseData$' -fuzztime 1000000x
          go test ./internal/protocol -run '^$' -fuzz '^FuzzParseClientHello$' -fuzztime 1000000x
          go test ./internal/protocol -run '^$' -fuzz '^FuzzParseServerHello$' -fuzztime 1000000x
          go test ./internal/protocol -run '^$' -fuzz '^FuzzParseControlFrame$' -fuzztime 1000000x
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{matrix.os}}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.x
      - name: Download Go modules
        run: go mod download
      - name: Vet Go code
        run: go vet ./...
      - name: Test Go code
        run: go test -v -race -covermode atomic -coverprofile coverage.out ./...
      - name: Upload code coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{secrets.CODECOV_TOKEN}}
          disable_search: true
          files: coverage.out
  kernel-wireguard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.x
      - name: Build kernel test tools
        run: docker build -t wirehop-integration test/integration
      - name: Test UDP socket recovery
        run: |
          CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/datagram.test" ./internal/datagram
          docker run --rm --network none --read-only --cap-add NET_ADMIN \
            -e WIREHOP_TEST_ROUTES=1 -v "$RUNNER_TEMP/datagram.test:/datagram.test:ro" \
            wirehop-integration /datagram.test \
            -test.run 'TestUDPRouteRecovery|TestLinuxUDPBatch.*Interrupted' -test.v
      - name: Test kernel WireGuard stability
        run: |
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/wirehop" ./cmd/wirehop
          sh test/integration/run.sh "$RUNNER_TEMP/wirehop" "$RUNNER_TEMP/kernel-results" \
            native forward tcp-latency tcp-loss tcp-stall wss forward-prohibit tcp-blackhole tcp-udp \
            tcp-ipv6 tcp-fwmark forward-fwmark tcp-mixed
      - name: Preserve kernel WireGuard results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kernel-wireguard-results
          path: ${{ runner.temp }}/kernel-results
  test-go-build:
    needs:
      - quality
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.x
      - name: Build Go binary
        env:
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags "-s -w" -o bin/ ./cmd/wirehop
  test-docker-build:
    needs:
      - quality
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: wirehop:latest
      - name: Test Docker image
        run: docker run --rm wirehop:latest --version
  test-goreleaser-release:
    needs:
      - quality
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.x
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Test Linux clock stack growth
        run: CGO_ENABLED=0 GOOS=linux GOARCH=ppc64le go test -gcflags=all=-l ./internal/monotime
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          args: release --clean --snapshot
