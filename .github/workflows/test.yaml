name: Test
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
      - name: Check Go formatting
        run: test -z "$(gofmt -l .)"
      - name: Fuzz input boundaries
        run: |
          go test ./internal/laneurl -run '^$' -fuzz '^FuzzParseDial$' -fuzztime 1000000x
          go test ./internal/laneurl -run '^$' -fuzz '^FuzzParseListen$' -fuzztime 1000000x
          go test ./internal/lanespec -run '^$' -fuzz '^FuzzParse$' -fuzztime 1000000x
          go test ./internal/target -run '^$' -fuzz '^FuzzParse$' -fuzztime 1000000x
          go test ./internal/wgpacket -run '^$' -fuzz '^FuzzClassify$' -fuzztime 1000000x
          go test ./internal/wgpacket -run '^$' -fuzz '^FuzzReservedText$' -fuzztime 1000000x
          go test ./internal/protocol -run '^$' -fuzz '^FuzzParseFrames$' -fuzztime 1000000x
          go test ./internal/protocol -run '^$' -fuzz '^FuzzParseData$' -fuzztime 1000000x
          go test ./internal/protocol -run '^$' -fuzz '^FuzzParseClientHello$' -fuzztime 1000000x
          go test ./internal/protocol -run '^$' -fuzz '^FuzzParseServerHello$' -fuzztime 1000000x
          go test ./internal/protocol -run '^$' -fuzz '^FuzzParseControlFrame$' -fuzztime 1000000x
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{matrix.os}}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
      - name: Download Go modules
        run: go mod download
      - name: Vet Go code
        run: go vet ./...
      - name: Test Go code
        run: go test -v -race -covermode atomic -coverprofile coverage.out ./...
      - name: Upload code coverage
        uses: codecov/codecov-action@v6
        with:
          token: ${{secrets.CODECOV_TOKEN}}
          disable_search: true
          files: coverage.out
  test-go-build:
    needs:
      - quality
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
      - name: Build Go binary
        env:
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags "-s -w" -o bin/ ./cmd/wirehop
  test-docker-build:
    needs:
      - quality
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: wirehop:latest
      - name: Test Docker image
        run: docker run --rm wirehop:latest --version
  test-goreleaser-release:
    needs:
      - quality
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          args: release --clean --snapshot
